<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="UTKCC — University of Toronto Korean Commerce Community">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#011536"/>
      <stop offset="0.45" stop-color="#032d6e"/>
      <stop offset="1" stop-color="#0a4aa8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9dcff"/>
    </linearGradient>
    <linearGradient id="logoFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9c8ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleShine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0 0; 1700 0; 1700 0" keyTimes="0; 0.3; 0.62; 1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fa8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9cc3ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5d9cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5d9cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fade" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1" fill="#fff" fill-opacity="0.16"/>
    </pattern>
    <mask id="dotMask"><rect width="1280" height="440" fill="url(#fade)"/></mask>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
    <clipPath id="titleClip"><rect x="0" y="182" width="1280" height="0">
      <animate attributeName="height" from="0" to="88" dur="0.9s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
      <animate attributeName="y" from="270" to="182" dur="0.9s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
    </rect></clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; text-anchor: middle; }
    .title { font-size: 72px; font-weight: 800; letter-spacing: 18px; }
    .sub { font-size: 19px; font-weight: 500; letter-spacing: 4px; fill: #dbe7ff; fill-opacity: .86; }
    .tag { font-size: 14px; font-weight: 700; letter-spacing: 4px; fill: #cfe0ff; }

    .aurora1 { animation: drift1 16s ease-in-out infinite alternate; }
    .aurora2 { animation: drift2 20s ease-in-out infinite alternate; }
    .aurora3 { animation: drift3 18s ease-in-out infinite alternate; }
    .mark { fill: none; stroke: #9cc3ff; stroke-opacity: .10; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .markR { animation: float 12s ease-in-out infinite; }
    .markL { animation: float 14s ease-in-out -5s infinite; }

    .halo { transform-box: fill-box; transform-origin: center; animation: fadeIn 1.2s ease-out .2s both, pulse 5s ease-in-out 1.4s infinite; }
    .logoWrap { animation: float 7s ease-in-out 2.2s infinite; }
    .stroke { fill: none; stroke: #e6efff; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(.65,0,.35,1) both, strokeOut .6s ease 1.7s forwards; }
    .stroke1 { animation-delay: .25s, 1.8s; }
    .stroke2 { animation-delay: .4s, 1.9s; }
    .fill { fill: url(#logoFill); opacity: 0; animation: fadeIn .8s ease 1.2s forwards; }
    .fill1 { animation-delay: 1.35s; }
    .fill2 { animation-delay: 1.5s; }

    .sub { animation: rise 1s cubic-bezier(.2,.8,.2,1) 1.3s both; }
    .rule { transform-box: fill-box; transform-origin: center; animation: grow 1s cubic-bezier(.2,.8,.2,1) 1.5s both; }
    .ruleDot { animation: fadeIn .6s ease 2.1s both, pulse 3s ease-in-out 2.7s infinite; transform-box: fill-box; transform-origin: center; }
    .pill { animation: rise 1s cubic-bezier(.2,.8,.2,1) 1.7s both; }
    .t1, .t2, .t3 { opacity: 0; animation: cycle 9s ease-in-out 2s infinite; }
    .t2 { animation-delay: 5s; }
    .t3 { animation-delay: 8s; }
    .spark { fill: #fff; opacity: 0; animation: twinkle 4s ease-in-out infinite; }
    .edgeLine { animation: fadeIn 1.4s ease 1.8s both; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes strokeOut { to { stroke-opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .7; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 7%, 29% { opacity: 1; transform: none; } 35%, 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: .85; } }
    @keyframes drift1 { to { transform: translate(140px, 40px); } }
    @keyframes drift2 { to { transform: translate(-160px, -30px); } }
    @keyframes drift3 { to { transform: translate(60px, -50px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      .t2, .t3, .spark { display: none; }
      .t1 { opacity: 1; animation: none !important; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <ellipse class="aurora1" cx="260" cy="120" rx="300" ry="160" fill="#1f63d6" fill-opacity=".55"/>
      <ellipse class="aurora2" cx="1060" cy="360" rx="340" ry="180" fill="#3b86ff" fill-opacity=".45"/>
      <ellipse class="aurora3" cx="700" cy="-40" rx="260" ry="120" fill="#7fb2ff" fill-opacity=".30"/>
    </g>
    <rect width="1280" height="440" fill="url(#dots)" mask="url(#dotMask)"/>
    <g class="markR"><g transform="translate(1130 250) scale(1.2968) translate(-243 -242.5)"><path class="mark" d="M215.2 42 L174 58.2 L170.5 273 L126.8 284.5 L126.8 80.2 L84 94.2 L84 316.5 L273.5 442.8 L310.8 426.2 L140.2 306.8 L198.5 287.8 L359.2 395.8 L399.8 379.2 L216.8 255.5 Z"/><path class="mark" d="M222.2 44 L223.2 69.8 L380 175.2 L380 360.5 L400.5 374.8 L401.8 163.2 Z"/><path class="mark" d="M222.2 87 L224.2 108.8 L344 188.2 L345 337.5 L366.5 350.8 L366.8 183.2 Z"/></g></g>
    <g class="markL"><g transform="translate(150 300) scale(0.7481) translate(-243 -242.5)"><path class="mark" d="M215.2 42 L174 58.2 L170.5 273 L126.8 284.5 L126.8 80.2 L84 94.2 L84 316.5 L273.5 442.8 L310.8 426.2 L140.2 306.8 L198.5 287.8 L359.2 395.8 L399.8 379.2 L216.8 255.5 Z"/><path class="mark" d="M222.2 44 L223.2 69.8 L380 175.2 L380 360.5 L400.5 374.8 L401.8 163.2 Z"/><path class="mark" d="M222.2 87 L224.2 108.8 L344 188.2 L345 337.5 L366.5 350.8 L366.8 183.2 Z"/></g></g>
    <circle class="spark" cx="132" cy="92" r="2.2" style="animation-delay:0s"/><circle class="spark" cx="248" cy="318" r="1.6" style="animation-delay:1.2s"/><circle class="spark" cx="388" cy="70" r="1.6" style="animation-delay:2.1s"/><circle class="spark" cx="330" cy="404" r="2.2" style="animation-delay:0.6s"/><circle class="spark" cx="836" cy="64" r="1.6" style="animation-delay:1.6s"/><circle class="spark" cx="930" cy="356" r="1.6" style="animation-delay:2.6s"/><circle class="spark" cx="1060" cy="118" r="2.2" style="animation-delay:0.3s"/><circle class="spark" cx="1168" cy="300" r="1.6" style="animation-delay:1.9s"/><circle class="spark" cx="1210" cy="78" r="1.6" style="animation-delay:3.1s"/><circle class="spark" cx="64" cy="236" r="2.2" style="animation-delay:2.4s"/><circle class="spark" cx="566" cy="48" r="1.6" style="animation-delay:3.4s"/><circle class="spark" cx="712" cy="402" r="1.6" style="animation-delay:1.1s"/>
    <rect class="edgeLine" x="0" y="438" width="1280" height="2" fill="url(#edge)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".10"/>

  <circle class="halo" cx="640" cy="112" r="110" fill="url(#glow)"/>
  <g class="logoWrap">
    <g transform="translate(640 112) scale(0.2793) translate(-243 -242.5)">
      <path class="fill fill0" d="M215.2 42 L174 58.2 L170.5 273 L126.8 284.5 L126.8 80.2 L84 94.2 L84 316.5 L273.5 442.8 L310.8 426.2 L140.2 306.8 L198.5 287.8 L359.2 395.8 L399.8 379.2 L216.8 255.5 Z" pathLength="1"/><path class="fill fill1" d="M222.2 44 L223.2 69.8 L380 175.2 L380 360.5 L400.5 374.8 L401.8 163.2 Z" pathLength="1"/><path class="fill fill2" d="M222.2 87 L224.2 108.8 L344 188.2 L345 337.5 L366.5 350.8 L366.8 183.2 Z" pathLength="1"/>
      <path class="stroke stroke0" d="M215.2 42 L174 58.2 L170.5 273 L126.8 284.5 L126.8 80.2 L84 94.2 L84 316.5 L273.5 442.8 L310.8 426.2 L140.2 306.8 L198.5 287.8 L359.2 395.8 L399.8 379.2 L216.8 255.5 Z" pathLength="1"/><path class="stroke stroke1" d="M222.2 44 L223.2 69.8 L380 175.2 L380 360.5 L400.5 374.8 L401.8 163.2 Z" pathLength="1"/><path class="stroke stroke2" d="M222.2 87 L224.2 108.8 L344 188.2 L345 337.5 L366.5 350.8 L366.8 183.2 Z" pathLength="1"/>
    </g>
  </g>

  <g clip-path="url(#titleClip)">
    <text class="title" x="649" y="258" fill="url(#ink)">UTKCC</text>
    <text class="title" x="649" y="258" fill="url(#titleShine)">UTKCC</text>
  </g>
  <text class="sub" x="642" y="298">University of Toronto Korean Commerce Community</text>

  <g>
    <rect class="rule" x="560" y="321" width="160" height="1.5" fill="url(#edge)"/>
    <circle class="ruleDot" cx="640" cy="321.75" r="3" fill="#cfe0ff"/>
  </g>

  <g class="pill">
    <rect x="405" y="346" width="470" height="40" rx="20" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"/>
    <text class="tag t1" x="642" y="371">20기 · 2026 – 2027</text>
    <text class="tag t2" x="642" y="371">ACADEMICS · CAREERS · COMMUNITY</text>
    <text class="tag t3" x="642" y="371">학업 · 커리어 · 네트워킹</text>
  </g>
</svg>
